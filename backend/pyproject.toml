[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "hakuna-tata", email = "610578197@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
